#################################
# Backend & VSync
#################################
backend = "glx";
vsync = true;
use-damage = false;

#################################
# Shadows
#################################
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-color = "#181825";

shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
# Fading
#################################
fading = true;
fade-in-step  = 1;
fade-out-step = 1;
fade-delta    = 7;

#################################
# Animations (PIJULIUS SYNTAX)
#################################
animations = true;
animation-stiffness = 120.0;
animation-dampening = 15.0;
animation-mass = 1.0;

# Event-based animations
animation-for-open-window      = "zoom";
animation-for-unmap-window     = "fade-out";
animation-for-transient-window = "slide-up";
animation-for-menu-window      = "slide-down";

#################################
# Transparency / Opacity
#################################
inactive-opacity = 0.92;
active-opacity   = 1.0;
frame-opacity    = 0.92;

opacity-rule = [
  "90:class_g = 'kitty'",
  "95:class_g = 'Nemo'",
  "95:class_g = 'code-oss'",
  "100:class_g = 'Polybar'",
  "100:class_g = 'rofi'"
];

#################################
# Blur (PIJULIUS)
#################################
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Steam'",
  "class_g = 'steam'",
  "class_g = 'steamwebhelper'"
];

#################################
# Corners
#################################
corner-radius = 3;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Don’t animate Steam windows
animation-exclude = [
  "class_g = 'Steam'",
  "class_g = 'steam'",
  "class_g = 'steamwebhelper'"
];

# Don’t unredirect Steam
unredir-if-possible-exclude = [
  "class_g = 'Steam'",
  "class_g = 'steam'",
  "class_g = 'steamwebhelper'"
];
